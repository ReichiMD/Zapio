name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug and release APK, lint, unit tests
        # Release is built unsigned here so R8 problems show up before merging.
        run: ./gradlew --stacktrace assembleDebug assembleRelease lintDebug :adb:test
      - name: Keep lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Keep debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Emulator test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v5
        with:
          name: debug-apk
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Talk to the emulator like to a TV
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZAPIO_EMULATOR: "1"
          ZAPIO_TEST_APK: ${{ github.workspace }}/test-apk/app-debug.apk
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --stacktrace :adb:test --rerun --tests "io.github.reichimd.zapio.adb.EmulatorTest"

  release:
    name: Signed release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ZAPIO_KEYSTORE_BASE64 is missing, cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zapio.keystore"
      - name: Build signed APK
        env:
          ZAPIO_KEYSTORE: ${{ runner.temp }}/zapio.keystore
          ZAPIO_KEYSTORE_PASSWORD: ${{ secrets.ZAPIO_KEYSTORE_PASSWORD }}
          ZAPIO_KEY_ALIAS: ${{ secrets.ZAPIO_KEY_ALIAS }}
          ZAPIO_KEY_PASSWORD: ${{ secrets.ZAPIO_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease
      - name: Check signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "zapio-${VERSION}.apk"
          # A re-run keeps the run number, so reuse the release instead of failing.
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "zapio-${VERSION}.apk" --clobber
          else
            gh release create "v${VERSION}" "zapio-${VERSION}.apk" \
              --target "$GITHUB_SHA" \
              --title "Zapio ${VERSION}" \
              --notes "Built from ${GITHUB_SHA::7}. Download the APK on your phone and install it."
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zapio.keystore"
